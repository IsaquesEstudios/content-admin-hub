server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # DNS resolver para proxy_pass com variáveis (necessário em Alpine/Docker)
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Manifest JSON do vite-react-ssg (evita 404 no client)
    location ~* /static-loader-data-manifest.*\.json$ {
        default_type application/json;
        return 200 '{}';
    }

    # Sitemap dinâmico via backend function
    location = /sitemap.xml {
        set $sitemap_upstream https://fuagnnrpnjpnrvudmtie.supabase.co/functions/v1/sitemap;
        return 301 $sitemap_upstream;
    }

    # Arquivos estáticos com cache longo (assets com hash no nome)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|mp4|webm|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do app: servir HTML pré-renderizado (SSG) ou fallback 410
    location / {
        try_files $uri $uri.html $uri/index.html @gone;
    }

    # Páginas inexistentes retornam 410 Gone (anti-SEO spam)
    location @gone {
        default_type text/html;
        return 410 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>410 - Página Removida</title><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0a0a0a;color:#fff}div{text-align:center}h1{font-size:4rem;margin:0;background:linear-gradient(135deg,#f97316,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}p{color:#999;margin:1rem 0 2rem}a{color:#f97316;text-decoration:none;padding:0.75rem 2rem;border:1px solid #f97316;border-radius:0.5rem}a:hover{background:#f97316;color:#fff}</style></head><body><div><h1>410</h1><p>Esta página foi permanentemente removida.</p><a href="/">Voltar ao Início</a></div></body></html>';
    }

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
