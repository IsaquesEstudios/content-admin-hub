server {
    listen 80;
    server_name eclipseled.com.br www.eclipseled.com.br;
    root /app/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Manifest JSON do vite-react-ssg (evita 404 no client)
    location ~* /static-loader-data-manifest.*\.json$ {
        default_type application/json;
        return 200 '{}';
    }

    # Sitemap dinâmico via backend function
    location = /sitemap.xml {
        return 301 https://fuagnnrpnjpnrvudmtie.supabase.co/functions/v1/sitemap;
    }

    # Arquivos estáticos com cache longo (assets com hash no nome)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|mp4|webm|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do app: servir HTML pré-renderizado (SSG) ou SPA fallback
    # Com dirStyle: 'nested', páginas SSG ficam em /path/index.html
    # Se nenhum arquivo estático for encontrado, validar via Edge Function (410 para URLs inválidas)
    location / {
        try_files $uri $uri.html $uri/index.html @validate;
    }

    # Validação de URL via Edge Function
    # Retorna 410 Gone para URLs inválidas (ataque SEO)
    # Retorna redirect para URLs válidas não pré-renderizadas
    location @validate {
        proxy_pass https://fuagnnrpnjpnrvudmtie.supabase.co/functions/v1/validate-url?path=$request_uri;
        proxy_set_header Host fuagnnrpnjpnrvudmtie.supabase.co;
        proxy_ssl_server_name on;
    }

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
