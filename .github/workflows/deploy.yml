name: Deploy Automático DirectAdmin

on:
  push:
    branches:
      - main  # ⚠️ VERIFIQUE: Se sua branch principal chamar 'master', mude aqui.

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    # 1. Baixa o código do seu GitHub
    - name: 🚚 Obter código mais recente
      uses: actions/checkout@v4

    # 2. Prepara o Node.js para construir o projeto
    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Instala as dependências (lê o package.json)
    - name: 📦 Instalar Dependências
      run: npm install

    # 4. Constrói o site (Gera a pasta 'dist')
    - name: 🛠️ Build do Projeto
      run: npm run build

    # 5. Envia os arquivos via FTP
    - name: 📂 Enviar via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./
        protocol: ftp
        dangerous-clean-slate: true
